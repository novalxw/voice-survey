<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Survey</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f4f6f8;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
    text-align: center;
}

.description {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 25px;
}


label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input,textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}


.question {

    border-top: 1px solid #eee;

    padding-top: 20px;

    margin-top: 20px;
}

.record-box {
    margin-top: 12px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 12px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 15px;
    cursor: pointer;
}

.record-btn {
    background: #dc3545;
    color: white;
}

.stop-btn {
    background: #343a40;
    color: white;
}


button:disabled {

    opacity: .45;

    cursor: not-allowed;

}


.timer {

    margin-top: 10px;

    font-weight: bold;

    color: #dc3545;

}


.status {

    margin-top: 8px;

    color: #666;

}


audio {

    width: 100%;

    margin-top: 12px;

}


.submit-btn {

    width: 100%;

    margin-top: 25px;

    padding: 15px;

    background: #198754;

    color: white;

    font-size: 17px;

    font-weight: bold;

}


.message {

    display: none;

    margin-top: 20px;

    padding: 15px;

    border-radius: 8px;

    text-align: center;

}


.success {

    display: block;

    background: #d1e7dd;

    color: #0f5132;

}


.error {

    display: block;

    background: #f8d7da;

    color: #842029;

}


</style>

</head>


<body>


<div class="container">


<h1>🎙️ Voice Survey</h1>


<div class="description">

Kami ingin mendengar pengalaman Anda.

Silakan jawab pertanyaan berikut.

</div>


<!-- NAME -->

<div class="form-group">

<label>Nama *</label>

<input
    type="text"
    id="name"
    placeholder="Masukkan nama Anda"
>


</div>


<!-- EMAIL -->

<div class="form-group">

<label>

Email

<span style="font-weight:normal;color:#777">

(op­sional)

</span>

</label>

<input
    type="email"
    id="email"
    placeholder="nama@email.com"
>

</div>


<!-- ========================== -->
<!-- QUESTION 1 -->
<!-- ========================== -->

<div class="question">

<div class="form-group">

<label>
1. Bagaimana pengalaman Anda menggunakan produk kami?
</label>


<textarea
    id="q1"
    placeholder="Anda dapat mengetik atau memberikan jawaban suara."
></textarea>


<div class="record-box">

<button
    type="button"
    class="record-btn"
    id="recordBtn1"
    onclick="startRecording(1)"
>

🎙️ Mulai Rekam

</button>


<button
    type="button"
    class="stop-btn"
    id="stopBtn1"
    onclick="stopRecording(1)"
    disabled
>

⏹️ Stop

</button>


<div
    class="timer"
    id="timer1"
>

00:00

</div>


<div
    class="status"
    id="status1"
>

Belum ada rekaman

</div>


<audio
    id="audio1"
    controls
    style="display:none"
></audio>


</div>

</div>

</div>


<!-- ========================== -->
<!-- QUESTION 2 -->
<!-- ========================== -->

<div class="question">

<div class="form-group">

<label>
2. Apa hal yang paling Anda sukai?
</label>


<textarea
    id="q2"
    placeholder="Anda dapat mengetik atau memberikan jawaban suara."
></textarea>


<div class="record-box">

<button
    type="button"
    class="record-btn"
    id="recordBtn2"
    onclick="startRecording(2)"
>

🎙️ Mulai Rekam

</button>


<button
    type="button"
    class="stop-btn"
    id="stopBtn2"
    onclick="stopRecording(2)"
    disabled
>

⏹️ Stop

</button>


<div
    class="timer"
    id="timer2"
>

00:00

</div>


<div
    class="status"
    id="status2"
>

Belum ada rekaman

</div>


<audio
    id="audio2"
    controls
    style="display:none"
></audio>


</div>

</div>

</div>


<!-- ========================== -->
<!-- QUESTION 3 -->
<!-- ========================== -->

<div class="question">

<div class="form-group">

<label>
3. Apa yang menurut Anda perlu kami perbaiki?
</label>


<textarea
    id="q3"
    placeholder="Anda dapat mengetik atau memberikan jawaban suara."
></textarea>


<div class="record-box">

<button
    type="button"
    class="record-btn"
    id="recordBtn3"
    onclick="startRecording(3)"
>

🎙️ Mulai Rekam

</button>


<button
    type="button"
    class="stop-btn"
    id="stopBtn3"
    onclick="stopRecording(3)"
    disabled
>

⏹️ Stop

</button>


<div
    class="timer"
    id="timer3"
>

00:00

</div>


<div
    class="status"
    id="status3"
>

Belum ada rekaman

</div>


<audio
    id="audio3"
    controls
    style="display:none"
></audio>


</div>

</div>

</div>


<button
    type="button"
    class="submit-btn"
    id="submitBtn"
    onclick="submitSurvey()"
>

📤 Kirim Survey

</button>


<div
    id="message"
    class="message"
></div>


</div>


<script>


// =================================================
// CONFIG
// =================================================


// PENTING!
// GANTI dengan URL Web App Apps Script Anda.

const API_URL = 'https://script.google.com/macros/s/AKfycbzvnSPZ1itPqYNDQSR3wtndMAotrZKBFpjytelnyRE3QEgO9JQZvQWtp4BkPS1JfQjIyQ/exec';
    
// Maximum recording
// 120 seconds = 2 minutes
const MAX_RECORDING_SECONDS = 120;


// =================================================
// VARIABLES
// =================================================

const recordings = {

    1: null,
    2: null,
    3: null

};


const recorders = {

    1: null,
    2: null,
    3: null

};


const streams = {

    1: null,
    2: null,
    3: null

};


const chunks = {

    1: [],
    2: [],
    3: []

};


const timers = {

    1: null,
    2: null,
    3: null

};


const startTimes = {

    1: null,
    2: null,
    3: null

};


let activeQuestion = null;


// =================================================
// START RECORDING
// =================================================

async function startRecording(
    question
) {


    // Prevent simultaneous recordings

    if (
        activeQuestion !== null
    ) {

        alert(
            'Hentikan rekaman yang sedang berjalan terlebih dahulu.'
        );

        return;

    }


    // Browser support

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            'Browser Anda tidak mendukung microphone recording.'
        );

        return;

    }


    try {


        // Request microphone

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        streams[question] =
            stream;


        // MIME type

        let mimeType =
            'audio/webm';


        if (
            !MediaRecorder.isTypeSupported(
                'audio/webm'
            )
        ) {

            if (
                MediaRecorder.isTypeSupported(
                    'audio/mp4'
                )
            ) {

                mimeType =
                    'audio/mp4';

            }

        }


        // Recorder

        const recorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:
                        mimeType
                }
            );


        recorders[question] =
            recorder;


        chunks[question] =
            [];


        activeQuestion =
            question;


        // Data available

        recorder.ondataavailable =
            function(event) {

                if (
                    event.data.size > 0
                ) {

                    chunks[question]
                        .push(
                            event.data
                        );

                }

            };


        // Stop event

        recorder.onstop =
            function() {


                const blob =
                    new Blob(
                        chunks[question],
                        {
                            type:
                                mimeType
                        }
                    );


                recordings[question] =
                    blob;


                const audio =
                    document.getElementById(
                        'audio' + question
                    );


                audio.src =
                    URL.createObjectURL(
                        blob
                    );


                audio.style.display =
                    'block';


                document.getElementById(
                    'status' + question
                ).innerText =
                    '✅ Rekaman siap dikirim';


                clearInterval(
                    timers[question]
                );


                if (
                    streams[question]
                ) {

                    streams[question]
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                }


                activeQuestion =
                    null;

            };


        // Start

        recorder.start();


        startTimes[question] =
            Date.now();


        // Buttons

        document.getElementById(
            'recordBtn' + question
        ).disabled = true;


        document.getElementById(
            'stopBtn' + question
        ).disabled = false;


        document.getElementById(
            'status' + question
        ).innerText =
            '🔴 Sedang merekam...';


        // Timer

        timers[question] =
            setInterval(
                function() {


                    const elapsed =
                        Math.floor(

                            (
                                Date.now() -
                                startTimes[question]

                            ) / 1000

                        );


                    const minutes =
                        String(
                            Math.floor(
                                elapsed / 60
                            )
                        ).padStart(
                            2,
                            '0'
                        );


                    const seconds =
                        String(
                            elapsed % 60
                        ).padStart(
                            2,
                            '0'
                        );


                    document.getElementById(
                        'timer' + question
                    ).innerText =

                        minutes +
                        ':' +
                        seconds;


                    // Automatic stop

                    if (
                        elapsed >=
                        MAX_RECORDING_SECONDS
                    ) {

                        stopRecording(
                            question
                        );

                    }


                },
                1000
            );


    } catch (error) {

        console.error(
            error
        );


        alert(
            'Microphone tidak dapat diakses.\n\n' +
            'Pastikan Anda memberikan izin microphone kepada browser.'
        );

    }

}


// =================================================
// STOP RECORDING
// =================================================

function stopRecording(
    question
) {


    const recorder =
        recorders[question];


    if (
        recorder &&
        recorder.state !== 'inactive'
    ) {

        recorder.stop();

    }


    document.getElementById(
        'recordBtn' + question
    ).disabled = false;


    document.getElementById(
        'stopBtn' + question
    ).disabled = true;

}


// =================================================
// BLOB → BASE64
// =================================================

function blobToBase64(
    blob
) {

    return new Promise(
        function(
            resolve,
            reject
        ) {


            const reader =
                new FileReader();


            reader.onloadend =
                function() {


                    const result =
                        reader.result;


                    const base64 =
                        result.split(
                            ','
                        )[1];


                    resolve({

                        base64:
                            base64,

                        mimeType:
                            blob.type

                    });

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                blob
            );

        }
    );

}


// =================================================
// SUBMIT
// =================================================

async function submitSurvey()
{

    const name =
        document.getElementById(
            'name'
        ).value.trim();


    const email =
        document.getElementById(
            'email'
        ).value.trim();


    const q1 =
        document.getElementById(
            'q1'
        ).value.trim();


    const q2 =
        document.getElementById(
            'q2'
        ).value.trim();


    const q3 =
        document.getElementById(
            'q3'
        ).value.trim();


    const button =
        document.getElementById(
            'submitBtn'
        );


    // ---------------------------------------------
    // Validation
    // ---------------------------------------------

    if (!name) {

        alert(
            'Nama wajib diisi.'
        );

        return;

    }


    if (
        activeQuestion !== null
    ) {

        alert(
            'Silakan hentikan rekaman terlebih dahulu.'
        );

        return;

    }


    if (
        !q1 &&
        !recordings[1]
    ) {

        alert(
            'Silakan jawab pertanyaan nomor 1.'
        );

        return;

    }


    // ---------------------------------------------
    // Disable
    // ---------------------------------------------

    button.disabled =
        true;


    button.innerText =
        '⏳ Mengirim...';


    try {


        // -----------------------------------------
        // Audio
        // -----------------------------------------

        let audioQ1 =
            null;

        let audioQ2 =
            null;

        let audioQ3 =
            null;


        if (
            recordings[1]
        ) {

            audioQ1 =
                await blobToBase64(
                    recordings[1]
                );

        }


        if (
            recordings[2]
        ) {

            audioQ2 =
                await blobToBase64(
                    recordings[2]
                );

        }


        if (
            recordings[3]
        ) {

            audioQ3 =
                await blobToBase64(
                    recordings[3]
                );

        }


        // -----------------------------------------
        // Payload
        // -----------------------------------------

        const payload = {

            name:
                name,

            email:
                email,

            q1:
                q1,

            q2:
                q2,

            q3:
                q3,

            audioQ1:
                audioQ1,

            audioQ2:
                audioQ2,

            audioQ3:
                audioQ3

        };


        // -----------------------------------------
        // Send
        // -----------------------------------------

        await fetch(
            API_URL,
            {

                method:
                    'POST',

                mode:
                    'no-cors',

                headers: {

                    'Content-Type':
                        'text/plain;charset=utf-8'

                },

                body:
                    JSON.stringify(
                        payload
                    )

            }
        );


        // -----------------------------------------
        // Success
        // -----------------------------------------

        showMessage(
            'success',
            '✅ Survey berhasil dikirim. Terima kasih!'
        );


        button.innerText =
            '✓ Terkirim';


        // Reset

        resetForm();


    } catch (error) {


        console.error(
            error
        );


        showMessage(
            'error',
            '❌ Gagal mengirim survey. Silakan coba lagi.'
        );


        button.disabled =
            false;


        button.innerText =
            '📤 Kirim Survey';

    }

}


// =================================================
// SHOW MESSAGE
// =================================================

function showMessage(
    type,
    text
) {

    const message =
        document.getElementById(
            'message'
        );


    message.className =
        'message ' +
        type;


    message.innerText =
        text;


    message.style.display =
        'block';

}


// =================================================
// RESET
// =================================================
function resetForm() {
    document.getElementById('name').value = '';
    document.getElementById('email').value = '';
    document.getElementById('q1').value = '';
    document.getElementById('q2').value = '';
    document.getElementById('q3').value = '';

    for ( let i = 1; i <= 3; i++ ) {
        recordings[i] = null;
        document.getElementById(
            'audio' + i
        ).style.display = 'none';
        document.getElementById(
            'timer' + i
        ).innerText = '00:00';
        document.getElementById(
            'status' + i
        ).innerText = 'Belum ada rekaman';
    }
}
</script>
</body>

</html>
